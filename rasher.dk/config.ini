[paths]
urls_file =            urls.txt
proxies_file =         sock5h_tor_proxies.txt
progress_file =        .download_progress.json
tar_file =             urls_downloaded.tar

[batch]
size =                 100

[proxy]
fail_threshold =       10
min_active =           8
cooldown_seconds =     2.0

[parallel]
max_workers =          16

[retry]
per_url_max_retries =  6

[jitter]
min_delay_ms =         33.0
max_delay_ms =         66.0
