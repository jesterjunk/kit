<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Analog TV Static v0002</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #777;
  }
  body { touch-action: none; }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #777;
  }
</style>
</head>
<body>
<canvas id="noise" aria-hidden="true"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('noise');

  function startFallback() {
    const ctx = canvas.getContext('2d', { alpha: false });
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d', { alpha: false, willReadFrequently: true });

    let image = null;
    let lastFrame = -1;
    const FRAME_RATE = 29.97;
    const GRAIN = 1.62;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(innerWidth * dpr));
      canvas.height = Math.max(1, Math.round(innerHeight * dpr));
      off.width = Math.max(1, Math.ceil(innerWidth / GRAIN));
      off.height = Math.max(1, Math.ceil(innerHeight / GRAIN));
      image = offCtx.createImageData(off.width, off.height);
      ctx.imageSmoothingEnabled = true;
    }

    function rndPow(exp) {
      return Math.pow(Math.random(), exp);
    }

    function render(now) {
      const frame = Math.floor(now * FRAME_RATE / 1000);
      if (frame !== lastFrame) {
        lastFrame = frame;
        const w = off.width;
        const h = off.height;
        const d = image.data;

        for (let y = 0; y < h; y++) {
          const rowJitter = (Math.random() - 0.5) * 16;
          const bandJitter = (Math.random() - 0.5) * 7;
          let x = 0;
          while (x < w) {
            const selector = Math.random();
            const run = selector < 0.46 ? 1 : selector < 0.80 ? 2 : selector < 0.94 ? 3 : 4 + ((Math.random() * 2) | 0);
            let n = rndPow(0.84);
            n = 0.74 * n + 0.18 * rndPow(0.95) + 0.08 * rndPow(1.3);
            if (Math.random() > 0.975) n = 0.96 + Math.random() * 0.04;
            else if (Math.random() < 0.025) n = Math.random() * 0.05;
            let v = 12 + n * 238 + rowJitter + bandJitter;
            v = Math.max(0, Math.min(255, v));

            for (let i = 0; i < run && x < w; i++, x++) {
              const idx = (y * w + x) * 4;
              const left = x > 0 ? d[idx - 4] : v;
              const up = y > 0 ? d[idx - w * 4] : v;
              const lum = Math.max(0, Math.min(255, v * 0.60 + left * 0.24 + up * 0.16));
              const c = (Math.random() - 0.5) * 4;
              d[idx] = Math.max(0, Math.min(255, lum + c));
              d[idx + 1] = lum;
              d[idx + 2] = Math.max(0, Math.min(255, lum - c));
              d[idx + 3] = 255;
            }
          }
        }

        offCtx.putImageData(image, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(render);
    }

    addEventListener('resize', resize, { passive: true });
    addEventListener('orientationchange', resize, { passive: true });
    resize();
    requestAnimationFrame(render);
  }

  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    desynchronized: true,
    powerPreference: 'high-performance'
  });

  if (!gl) {
    startFallback();
    return;
  }

  const vs = `#version 300 es
  precision highp float;
  const vec2 P[3] = vec2[3](
    vec2(-1.0, -1.0),
    vec2( 3.0, -1.0),
    vec2(-1.0,  3.0)
  );
  void main() {
    gl_Position = vec4(P[gl_VertexID], 0.0, 1.0);
  }`;

  const fs = `#version 300 es
  precision highp float;
  precision highp int;

  uniform float uDpr;
  uniform uint uFrame;
  out vec4 outColor;

  uint hash32(uint x) {
    x ^= x >> 16;
    x *= 0x7feb352du;
    x ^= x >> 15;
    x *= 0x846ca68bu;
    x ^= x >> 16;
    return x;
  }

  float rnd(ivec2 p, uint seed) {
    uint x = uint(p.x) * 0x9e3779b9u;
    uint y = uint(p.y) * 0x85ebca6bu;
    return float(hash32(x ^ y ^ seed)) * (1.0 / 4294967295.0);
  }

  float baseField(ivec2 p, uint seed) {
    float selector = rnd(ivec2(p.x >> 1, p.y), seed ^ 0xa511e9b3u);
    float fine = rnd(p, seed);
    float pair = rnd(ivec2(p.x >> 1, p.y), seed ^ 0x63d83595u);
    float trip = rnd(ivec2(p.x / 3, p.y), seed ^ 0xb5297a4du);
    float quad = rnd(ivec2(p.x / 4, p.y), seed ^ 0x27d4eb2fu);
    float vertical = rnd(ivec2(p.x, p.y >> 1), seed ^ 0x165667b1u);

    float n = selector < 0.44 ? fine : (selector < 0.79 ? pair : (selector < 0.93 ? trip : quad));
    n = n * 0.84 + vertical * 0.16;

    float impulse = rnd(p, seed ^ 0xc2b2ae35u);
    if (impulse > 0.977) n = 0.97 + 0.03 * rnd(p, seed ^ 0x1b873593u);
    else if (impulse < 0.023) n = 0.03 * rnd(p, seed ^ 0x68e31da4u);
    return n;
  }

  float filteredField(ivec2 p, uint seed) {
    float c  = baseField(p, seed);
    float l1 = baseField(p + ivec2(-1, 0), seed);
    float r1 = baseField(p + ivec2( 1, 0), seed);
    float l2 = baseField(p + ivec2(-2, 0), seed);
    float r2 = baseField(p + ivec2( 2, 0), seed);
    float u1 = baseField(p + ivec2( 0,-1), seed);
    float d1 = baseField(p + ivec2( 0, 1), seed);
    float ul = baseField(p + ivec2(-1,-1), seed);
    float ur = baseField(p + ivec2( 1,-1), seed);
    float dl = baseField(p + ivec2(-1, 1), seed);
    float dr = baseField(p + ivec2( 1, 1), seed);

    return c  * 0.28 +
           (l1 + r1) * 0.17 +
           (l2 + r2) * 0.08 +
           (u1 + d1) * 0.06 +
           (ul + ur + dl + dr) * 0.025;
  }

  void main() {
    const float grain = 1.62;
    vec2 css = gl_FragCoord.xy / max(uDpr, 1.0);
    ivec2 p = ivec2(floor(css / grain));

    uint s0 = hash32(uFrame + 0x243f6a88u);
    uint s1 = hash32((uFrame > 0u ? uFrame - 1u : 0u) + 0x13198a2eu);

    float current = filteredField(p, s0);
    float previous = filteredField(p, s1);
    float n = current * 0.92 + previous * 0.08;

    float lineJitter = rnd(ivec2(0, p.y), s0 ^ 0x9e3779b9u) - 0.5;
    float bandJitter = rnd(ivec2(1, p.y / 3), s0 ^ 0x85ebca6bu) - 0.5;

    float lum = 0.05 + 0.93 * pow(clamp(n, 0.0, 1.0), 0.82);
    lum += lineJitter * 0.040 + bandJitter * 0.018;

    float chroma = (rnd(p, s0 ^ 0xd3a2646cu) - 0.5) * 0.016;
    vec3 rgb = vec3(lum + chroma, lum, lum - chroma);
    outColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
  }`;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'Shader compilation failed');
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || 'Program linking failed');
  }

  gl.useProgram(program);
  const dprLoc = gl.getUniformLocation(program, 'uDpr');
  const frameLoc = gl.getUniformLocation(program, 'uFrame');
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  let dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2.5);
    const w = Math.max(1, Math.round(innerWidth * dpr));
    const h = Math.max(1, Math.round(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform1f(dprLoc, dpr);
  }

  let lastFrame = -1;
  function render(t) {
    const f = Math.floor(t * 0.02997) >>> 0;
    if (f !== lastFrame) {
      lastFrame = f;
      gl.uniform1ui(frameLoc, f);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(render);
  }

  addEventListener('resize', resize, { passive: true });
  addEventListener('orientationchange', resize, { passive: true });
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
