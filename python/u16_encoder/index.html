<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python u16 Encoder</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101114;
            color: #f2f2f2;
        }

        main {
            width: min(1000px, 100%);
            margin: 0 auto;
            padding: 32px 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #b8b8b8;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea,
        pre {
            width: 100%;
            border: 1px solid #343740;
            border-radius: 12px;
            background: #181a20;
            color: #f2f2f2;
            font: 15px/1.5 Consolas, Monaco, monospace;
        }

        textarea {
            min-height: 180px;
            padding: 16px;
            resize: none;
            overflow: hidden;
            outline: none;
        }

        textarea:focus {
            border-color: #6ea8ff;
        }

        pre {
            min-height: 120px;
            margin: 0;
            padding: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            cursor: pointer;
            user-select: all;
        }

        .section {
            margin-bottom: 24px;
        }

        .hint {
            margin-top: 8px;
            font-size: 13px;
            color: #9a9a9a;
        }

        .splash {
            position: fixed;
            left: 50%;
            bottom: 32px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #f2f2f2;
            color: #101114;
            font-weight: bold;
            opacity: 0;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .splash.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>
    <main>
        <h1>Python u16 Encoder</h1>
        <p>Type Python code below. The u16 exec output updates automatically.</p>

        <div class="section">
            <label for="input_textarea">Python input</label>
            <textarea id="input_textarea" spellcheck="false" placeholder="print('hello world')"></textarea>
        </div>

        <div class="section">
            <label for="output_pre">u16 exec output</label>
            <pre id="output_pre" tabindex="0"></pre>
            <div class="hint">Click the output to copy it exactly.</div>
        </div>
    </main>

    <div id="splash" class="splash" aria-live="polite">Copied</div>

    <script>
        (function () {
            var input_textarea = document.getElementById("input_textarea");
            var output_pre = document.getElementById("output_pre");
            var splash = document.getElementById("splash");
            var splash_timeout = null;

            function create_python_string_literal(text) {
                var literal_parts = ["'"];
                var index = 0;
                var code_point = 0;
                var character = "";

                for (index = 0; index < text.length; index += 1) {
                    code_point = text.codePointAt(index);
                    character = String.fromCodePoint(code_point);

                    if (code_point > 0xffff) {
                        index += 1;
                    }

                    if (character === "\\") {
                        literal_parts.push("\\\\");
                    } else if (character === "'") {
                        literal_parts.push("\\'");
                    } else if (character === "\n") {
                        literal_parts.push("\\n");
                    } else if (character === "\r") {
                        literal_parts.push("\\r");
                    } else if (character === "\t") {
                        literal_parts.push("\\t");
                    } else if (character === "\b") {
                        literal_parts.push("\\b");
                    } else if (character === "\f") {
                        literal_parts.push("\\f");
                    } else if (code_point >= 32 && code_point <= 126) {
                        literal_parts.push(character);
                    } else if (code_point <= 0xffff) {
                        literal_parts.push("\\u" + code_point.toString(16).padStart(4, "0"));
                    } else {
                        literal_parts.push("\\U" + code_point.toString(16).padStart(8, "0"));
                    }
                }

                literal_parts.push("'");

                return literal_parts.join("");
            }

            function ascii_to_bytes(text) {
                var byte_values = [];
                var index = 0;

                for (index = 0; index < text.length; index += 1) {
                    byte_values.push(text.charCodeAt(index));
                }

                return byte_values;
            }

            function bytes_to_actual_u16_characters(byte_values) {
                var encoded_parts = [];
                var index = 0;
                var code_unit = 0;

                if (byte_values.length % 2 !== 0) {
                    byte_values.push(10);
                }

                for (index = 0; index < byte_values.length; index += 2) {
                    code_unit = byte_values[index] + (byte_values[index + 1] * 256);
                    encoded_parts.push(String.fromCharCode(code_unit));
                }

                return encoded_parts.join("");
            }

            function create_u16_exec_output(python_code) {
                var python_literal = create_python_string_literal(python_code);
                var safe_source = "exec(" + python_literal + ")";
                var byte_values = ascii_to_bytes(safe_source);
                var encoded_text = bytes_to_actual_u16_characters(byte_values);

                return "exec(bytes('" + encoded_text + "','u16')[2:])";
            }

            function resize_input_textarea() {
                input_textarea.style.height = "auto";
                input_textarea.style.height = input_textarea.scrollHeight + "px";
            }

            function update_output() {
                output_pre.textContent = create_u16_exec_output(input_textarea.value);
                resize_input_textarea();
            }

            function show_splash(message) {
                splash.textContent = message;
                splash.classList.add("show");

                if (splash_timeout !== null) {
                    clearTimeout(splash_timeout);
                }

                splash_timeout = setTimeout(function () {
                    splash.classList.remove("show");
                }, 1100);
            }

            function fallback_copy(text) {
                var copy_textarea = document.createElement("textarea");
                var was_copied = false;

                copy_textarea.value = text;
                copy_textarea.setAttribute("readonly", "");
                copy_textarea.style.position = "fixed";
                copy_textarea.style.left = "-9999px";
                copy_textarea.style.top = "-9999px";

                document.body.appendChild(copy_textarea);
                copy_textarea.select();

                try {
                    was_copied = document.execCommand("copy");
                } catch (error) {
                    was_copied = false;
                }

                document.body.removeChild(copy_textarea);

                if (was_copied) {
                    show_splash("Copied");
                } else {
                    show_splash("Copy failed");
                }
            }

            function copy_output() {
                var output_text = output_pre.textContent;

                if (!output_text) {
                    return;
                }

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(output_text).then(function () {
                        show_splash("Copied");
                    }, function () {
                        fallback_copy(output_text);
                    });
                } else {
                    fallback_copy(output_text);
                }
            }

            input_textarea.addEventListener("input", update_output);
            output_pre.addEventListener("click", copy_output);
            output_pre.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    copy_output();
                }
            });

            update_output();
        }());
    </script>
</body>
</html>
