<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Analog TV Static</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #777;
  }
  body { touch-action: none; }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #777;
  }
</style>
</head>
<body>
<canvas id="noise" aria-hidden="true"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('noise');
  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    desynchronized: true,
    powerPreference: 'high-performance'
  });

  // Fallback for older browsers: still fills the page with animated monochrome static.
  if (!gl) {
    const ctx = canvas.getContext('2d', { alpha: false });
    let timer = 0;
    function resizeFallback() {
      const grain = 1.35;
      canvas.width = Math.max(1, Math.ceil(innerWidth / grain));
      canvas.height = Math.max(1, Math.ceil(innerHeight / grain));
      canvas.style.imageRendering = 'pixelated';
    }
    function frameFallback(now) {
      if (now - timer > 33) {
        timer = now;
        const w = canvas.width, h = canvas.height;
        const image = ctx.createImageData(w, h);
        const d = image.data;
        const rowBias = new Float32Array(h);
        for (let y = 0; y < h; y++) rowBias[y] = (Math.random() - 0.5) * 22;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            // Mostly independent noise with occasional 2–3 px horizontal runs.
            const i = (y * w + x) * 4;
            let r = Math.random();
            if (x > 0 && Math.random() < 0.28) r = d[i - 4] / 255;
            let v = 31 + Math.pow(r, 1.08) * 201 + rowBias[y];
            if (Math.random() < 0.025) v = 245 + Math.random() * 10;
            else if (Math.random() < 0.025) v = Math.random() * 24;
            v = Math.max(0, Math.min(255, v));
            const chroma = (Math.random() - 0.5) * 5;
            d[i] = Math.max(0, Math.min(255, v + chroma));
            d[i + 1] = v;
            d[i + 2] = Math.max(0, Math.min(255, v - chroma));
            d[i + 3] = 255;
          }
        }
        ctx.putImageData(image, 0, 0);
      }
      requestAnimationFrame(frameFallback);
    }
    addEventListener('resize', resizeFallback, { passive: true });
    resizeFallback();
    requestAnimationFrame(frameFallback);
    return;
  }

  const vs = `#version 300 es
  precision highp float;
  const vec2 P[3] = vec2[3](
    vec2(-1.0, -1.0),
    vec2( 3.0, -1.0),
    vec2(-1.0,  3.0)
  );
  void main() {
    gl_Position = vec4(P[gl_VertexID], 0.0, 1.0);
  }`;

  const fs = `#version 300 es
  precision highp float;
  precision highp int;
  precision highp usampler2D;

  uniform float uDpr;
  uniform uint uFrame;
  out vec4 outColor;

  uint hash32(uint x) {
    x ^= x >> 16;
    x *= 0x7feb352du;
    x ^= x >> 15;
    x *= 0x846ca68bu;
    x ^= x >> 16;
    return x;
  }

  float rnd(ivec2 p, uint seed) {
    uint x = uint(p.x) * 0x9e3779b9u;
    uint y = uint(p.y) * 0x85ebca6bu;
    return float(hash32(x ^ y ^ seed)) * (1.0 / 4294967295.0);
  }

  float field(ivec2 p, uint seed) {
    // CRT-like tiny horizontal dashes: most samples are single-pixel,
    // while some are shared by 2- and 3-pixel horizontal groups.
    float selector = rnd(p, seed ^ 0xa511e9b3u);
    float fine = rnd(p, seed);
    float pair = rnd(ivec2(p.x >> 1, p.y), seed ^ 0x63d83595u);
    float trip = rnd(ivec2(p.x / 3, p.y), seed ^ 0xb5297a4du);
    float n = selector < 0.59 ? fine : (selector < 0.89 ? pair : trip);

    // Add a little local energy without blurring away the crisp static.
    float left  = rnd(p + ivec2(-1, 0), seed ^ 0x68e31da4u);
    float right = rnd(p + ivec2( 1, 0), seed ^ 0x1b56c4e9u);
    n = mix(n, (left + 2.0*n + right) * 0.25, 0.16);

    // Sparse hot and dead specks, common in photographed analog snow.
    float impulse = rnd(p, seed ^ 0xc2b2ae35u);
    if (impulse > 0.977) n = 0.96 + 0.04 * rnd(p, seed ^ 0x27d4eb2fu);
    else if (impulse < 0.023) n = 0.04 * rnd(p, seed ^ 0x165667b1u);
    return n;
  }

  void main() {
    // Work in CSS-pixel space so grain stays visually consistent on HiDPI screens.
    const float grain = 1.18;
    vec2 css = gl_FragCoord.xy / max(uDpr, 1.0);
    ivec2 p = ivec2(floor(css / grain));

    uint s0 = hash32(uFrame + 0x243f6a88u);
    uint s1 = hash32((uFrame > 0u ? uFrame - 1u : 0u) + 0x13198a2eu);

    float current = field(p, s0);
    float previous = field(p, s1);

    // A small one-frame persistence gives convincing CRT/phosphor texture
    // without introducing a glow, vignette, or brightness gradient.
    float n = current * 0.84 + previous * 0.16;

    // Fine per-scanline gain jitter. It is random per row, not a gradient.
    float line = rnd(ivec2(0, p.y), s0 ^ 0x9e3779b9u) - 0.5;
    float line2 = rnd(ivec2(1, p.y >> 1), s0 ^ 0x85ebca6bu) - 0.5;

    // Shape the luminance distribution toward the reference: dense mid-gray
    // snow with frequent bright/dark flecks rather than pure binary pixels.
    float lum = 0.105 + 0.80 * pow(n, 1.07);
    lum += line * 0.055 + line2 * 0.020;

    // Extremely subtle RGB separation from analog/camera capture, while
    // remaining perceptually monochrome.
    float c = (rnd(p, s0 ^ 0xd3a2646cu) - 0.5) * 0.022;
    vec3 rgb = vec3(lum + c, lum, lum - c);
    outColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
  }`;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'Shader compilation failed');
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || 'Program linking failed');
  }

  gl.useProgram(program);
  const dprLoc = gl.getUniformLocation(program, 'uDpr');
  const frameLoc = gl.getUniformLocation(program, 'uFrame');
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  let dpr = 1;
  function resize() {
    // Cap only to avoid waste on extreme-density mobile panels; shader grain
    // is defined in CSS pixels, so this does not make the texture coarser.
    dpr = Math.min(devicePixelRatio || 1, 2.5);
    const w = Math.max(1, Math.round(innerWidth * dpr));
    const h = Math.max(1, Math.round(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform1f(dprLoc, dpr);
  }

  let lastFrame = -1;
  function render(t) {
    // NTSC-ish refresh cadence, intentionally frame-quantized.
    const f = Math.floor(t * 0.02997) >>> 0;
    if (f !== lastFrame) {
      lastFrame = f;
      gl.uniform1ui(frameLoc, f);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(render);
  }

  addEventListener('resize', resize, { passive: true });
  addEventListener('orientationchange', resize, { passive: true });
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
