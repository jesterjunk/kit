<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>LCG Pixel Pattern</title>
    <style>
    * {
        box-sizing: border-box;
    }
    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #061806;
        font-family: sans-serif;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    canvas {
        display: block;
        flex: 0 0 auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }
    main {
        flex: 1;
        min-height: 0;
        overflow: auto;
    }
    #canvases {
        width: 960px;
        min-height: 100%;
        margin: 0 auto;
        padding: 42px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        gap: 42px;
    }
    form {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto auto;
        align-items: center;
        justify-content: center;
        gap: .4em .75em;
        padding: .45em .75em;
        background: #031003;
        color: #59d24b;
        font: 700 clamp(14px,1.5vw,18px) / 1 monospace;
        white-space: nowrap;
        box-shadow: 0 0 0 2px #071807;
    }
    #variable_inputs {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .35em;
        font-size: clamp(18px,2.4vw,26px);
    }
    #palette_controls {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: .5em;
        font-size: clamp(12px,1.1vw,15px);
    }
    #entropy_quality {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        font-size: clamp(12px,1.1vw,15px);
    }
    input,
    select,
    button {
        width: 4.6em;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #76e85f;
        font: inherit;
        text-align: center;
        -moz-appearance: textfield;
    }
    select {
        width: 15em;
        padding: .25em .4em;
        text-align: left;
        border: 1px solid #071807;
        text-shadow: 0 1px 1px #000;
    }
    button {
        width: 15em;
        padding: .25em .4em;
        background: #031003;
        box-shadow: 0 0 0 1px #071807;
        cursor: pointer;
    }
    #palette_name {
        display: none;
    }
    #palette_picker {
        position: relative;
        width: 15em;
        margin-right: 20px;
    }
    #palette_button {
        text-align: left;
        text-shadow: 0 1px 1px #000;
    }
    #palette_options {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 2;
        width: 15em;
        background: #031003;
        box-shadow: 0 0 0 1px #071807;
    }
    #palette_picker.open #palette_options {
        display: flex;
        flex-direction: column;
    }
    .palette_option {
        width: 15em;
        text-align: left;
        text-shadow: 0 1px 1px #000;
        box-shadow: none;
    }
    #px {
        width: 2.6em;
    }
    #palette_swatches {
        grid-column: 1 / 4;
        grid-row: 2;
        justify-self: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5em;
        font-size: clamp(10px,.9vw,13px);
        flex-wrap: wrap;
    }
    .swatch {
        display: flex;
        align-items: center;
        gap: .2em;
    }
    .swatch_color {
        width: 1em;
        height: 1em;
        box-shadow: 0 0 0 1px #071807;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
    }
</style>
</head>
<body>


<form id="controls" autocomplete="off">
    <span id="entropy_quality">entropy quality: --</span>
    <span id="variable_inputs">
        <span>seed = (seed*</span>
        <input id="a" type="number" step="1" value="9346">
        <span>+</span>
        <input id="c" type="number" step="1" value="7">
        <span>)%</span>
        <input id="m" type="number" step="1" value="233646">
        <span>px</span>
        <input id="px" type="number" step="1" value="4" min="1">
    </span>
    <span id="palette_controls">
        <span id="palette_picker">
            <select id="palette_name"></select>
            <button id="palette_button" type="button"></button>
            <span id="palette_options"></span>
        </span>
        <button id="clear_storage" type="button">clear storage</button>
    </span>
    <span id="palette_swatches"></span>
</form>
<main>
    <div id="canvases">
        <canvas id="canvas_1" width="960" height="270"></canvas>
        <canvas id="canvas_2" width="630" height="270"></canvas>
        <canvas id="canvas_3" width="480" height="270"></canvas>
    </div>
</main>
<script>
var canvas = document.getElementById('canvas_1');
var ctx = canvas.getContext('2d', { alpha: false });
var canvas_2 = document.getElementById('canvas_2');
var canvas_3 = document.getElementById('canvas_3');
var inputs = [...document.querySelectorAll('input')];

// var a = 9346,
    // c = 629,
    // m = 233625;

var a = 9346,
    c = 7,
    m = 233646;

var pending = false;
var px = 3;
var storage_key = 'lcg_pixel_pattern_settings';
var palette_name = 'blighted_paint_16c';
var palettes = {
    "greens": "#051805,#0d2d0b,#15500f,#247a19,#39ad2a,#62db4d,",

    // https://lospec.com/palette-list/blighted-paint
    "blighted_paint_16c": "#6c475a,#976c73,#b4b18f,#ac9253,#976a4a,#7e4d4b,#583a41,#41303a,#453c55,#43526c,#4b7b7d,#6ca28d,#9fb49a,#c9c4b6,#749c6b,#457967,",

    // https://lospec.com/palette-list/icywitch
    "icywitch": "#313638,#32535f,#0a777a,#4aa881,#73efe8,#ecf3b0,",

    // https://lospec.com/palette-list/a-bad-light
    "a_bad_light": "#1a1d24,#7e4f58,#e7e6d7,",

    // https://lospec.com/palette-list/just-shapes-and-bits
    "just_shapes_and_bits": "#770e50,#5ccce0,",

    //
    "crystallinemoss": "#6e1835,#942341,#a03d4c,#a6575d,#bc827c,#d4b29f,#d0c0c1,#dddddd,#adb6b7,#6caba6,#3b524a,#2d3d3d,#303630,#2b2b0d,#4d492e,#76553c,#a79692,#766e6e,#534b4b,#512b2e,#733d40,#4a3f44,#282828,#191216,",
};

var palette = get_palette(palette_name)

function get_palette(palette_name_value) {
    return palettes[palette_name_value].split(`,`).filter(function(palette_color) {
        return palette_color;
    });
}

function get_palette_background(palette_colors) {
    var gradient_parts = [];

    for (var palette_index = 0; palette_index < palette_colors.length; palette_index++) {
        var palette_start = palette_index / palette_colors.length * 100;
        var palette_end = (palette_index + 1) / palette_colors.length * 100;
        gradient_parts.push(palette_colors[palette_index] + ' ' + palette_start + '% ' + palette_end + '%');
    }

    return 'linear-gradient(90deg,' + gradient_parts.join(',') + ')';
}

function get_palette_text_color(palette_colors) {
    var r = 0;
    var g = 0;
    var b = 0;

    for (var palette_index = 0; palette_index < palette_colors.length; palette_index++) {
        r += parseInt(palette_colors[palette_index].slice(1, 3), 16);
        g += parseInt(palette_colors[palette_index].slice(3, 5), 16);
        b += parseInt(palette_colors[palette_index].slice(5, 7), 16);
    }

    r = r / palette_colors.length;
    g = g / palette_colors.length;
    b = b / palette_colors.length;

    return (r * 299 + g * 587 + b * 114) / 1000 > 140 ? '#031003' : '#ecf3b0';
}

function setup_palettes() {
    var palette_select = document.getElementById('palette_name');
    var palette_options = document.getElementById('palette_options');

    for (var palette_key in palettes) {
        var palette_option = document.createElement('option');
        var palette_button = document.createElement('button');
        var palette_option_colors = get_palette(palette_key);
        palette_option.value = palette_key;
        palette_option.textContent = palette_key;
        palette_select.appendChild(palette_option);

        palette_button.type = 'button';
        palette_button.className = 'palette_option';
        palette_button.setAttribute('data-palette-name', palette_key);
        palette_button.textContent = palette_key;
        palette_button.style.background = get_palette_background(palette_option_colors);
        palette_button.style.color = get_palette_text_color(palette_option_colors);
        palette_button.addEventListener('click', function() {
            document.getElementById('palette_name').value = this.getAttribute('data-palette-name');
            document.getElementById('palette_picker').classList.remove('open');
            queue();
        });
        palette_options.appendChild(palette_button);
    }

    palette_select.value = palette_name;
}

function load_settings() {
    var saved_settings = localStorage.getItem(storage_key);

    if (!saved_settings) {
        return;
    }

    saved_settings = JSON.parse(saved_settings);

    if (saved_settings.a !== undefined) document.getElementById('a').value = saved_settings.a;
    if (saved_settings.c !== undefined) document.getElementById('c').value = saved_settings.c;
    if (saved_settings.m !== undefined) document.getElementById('m').value = saved_settings.m;
    if (saved_settings.px !== undefined) document.getElementById('px').value = saved_settings.px;
    if (saved_settings.palette_name !== undefined && palettes[saved_settings.palette_name]) document.getElementById('palette_name').value = saved_settings.palette_name;
}

function save_settings() {
    localStorage.setItem(storage_key, JSON.stringify({
        a: a,
        c: c,
        m: m,
        px: px,
        palette_name: palette_name
    }));
}

function clear_storage() {
    if (!confirm('Clear saved settings?')) {
        return;
    }

    localStorage.removeItem(storage_key);
    location.reload();
}

function toggle_palette_options(event) {
    event.stopPropagation();
    document.getElementById('palette_picker').classList.toggle('open');
}

function close_palette_options(event) {
    if (!document.getElementById('palette_picker').contains(event.target)) {
        document.getElementById('palette_picker').classList.remove('open');
    }
}

function update_palette_display() {
    var palette_button = document.getElementById('palette_button');
    var palette_swatches = document.getElementById('palette_swatches');

    palette_button.textContent = palette_name;
    palette_button.style.background = get_palette_background(palette);
    palette_button.style.color = get_palette_text_color(palette);
    palette_swatches.innerHTML = '';

    for (var palette_index = 0; palette_index < palette.length; palette_index++) {
        var palette_color = palette[palette_index];
        var swatch = document.createElement('span');
        var swatch_color = document.createElement('span');
        var swatch_label = document.createElement('span');

        swatch.className = 'swatch';
        swatch_color.className = 'swatch_color';
        swatch_color.style.background = palette_color;
        swatch_label.textContent = palette_color;

        swatch.appendChild(swatch_color);
        swatch.appendChild(swatch_label);
        palette_swatches.appendChild(swatch);
    }
}

function update_entropy_quality(symbol_counts, symbol_total, possible_symbol_count, period_size) {
    var entropy_bits = get_entropy(symbol_counts, symbol_total);
    var max_entropy_bits = Math.log2(Math.min(possible_symbol_count, symbol_total));

    var entropy_quality = max_entropy_bits
        ? Math.max(0, Math.min(100, Math.round(entropy_bits / max_entropy_bits * 100)))
        : 100;

    document.getElementById('entropy_quality').textContent =
        'entropy quality: ' + entropy_quality + '% (' + entropy_bits.toFixed(4) + ' bits), period: ' + period_size;
}

function get_entropy(counts, total) {
    var entropy = 0;
    var count_values = Array.isArray(counts) ? counts : Object.values(counts);

    for (var count_index = 0; count_index < count_values.length; count_index++) {
        var count = count_values[count_index];

        if (count) {
            var probability = count / total;
            entropy -= probability * Math.log2(probability);
        }
    }

    return entropy;
}

function get_next_seed(seed_value) {
    return (seed_value * a + c) % m;
}

function get_period_size(seed_value) {
    var power = 1;
    var period_size = 1;
    var tortoise = seed_value;
    var hare = get_next_seed(seed_value);

    while (tortoise !== hare) {
        if (power === period_size) {
            tortoise = hare;
            power *= 2;
            period_size = 0;
        }

        hare = get_next_seed(hare);
        period_size++;
    }

    return period_size;
}

function sync() {
    a = Math.trunc(+document.getElementById('a').value || 0);
    c = Math.trunc(+document.getElementById('c').value || 0);
    m = Math.max(1, Math.trunc(+document.getElementById('m').value || 1));
    px = Math.max(1, Math.trunc(+document.getElementById('px').value || 1));
    palette_name = document.getElementById('palette_name').value;
    palette = get_palette(palette_name);
    save_settings();
    update_palette_display();
    draw();
}

function queue() {
    if (!pending) requestAnimationFrame(() => (pending = false, sync()));
    pending = true;
}

function draw() {
    var w = Math.ceil(canvas.width / px),
        h = Math.ceil(canvas.height / px);
    var state_counts = {};
    var state_total = 0;
    ctx.imageSmoothingEnabled = false;

    var seed = 1 % m;
    var period_size = get_period_size(seed);

    for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
            seed = get_next_seed(seed);

            state_counts[seed] = (state_counts[seed] || 0) + 1;
            state_total++;

            var v = seed / m;
            var band = ((seed >> 2) + x * 5 + y * 11) % palette.length;
            ctx.fillStyle = palette[(band + (v > .50) + (v > .73) + (v > .88)) % palette.length];
            ctx.fillRect(x * px, y * px, px, px);
        }
    }
    update_entropy_quality(state_counts, state_total, m, period_size);
    crop_canvas(canvas_2);
    crop_canvas(canvas_3);
}

function crop_canvas(cropped_canvas) {
    var cropped_ctx = cropped_canvas.getContext('2d', { alpha: false });
    cropped_ctx.imageSmoothingEnabled = false;
    cropped_ctx.drawImage(canvas, (canvas.width - cropped_canvas.width) / 2, 0, cropped_canvas.width, cropped_canvas.height, 0, 0, cropped_canvas.width, cropped_canvas.height);
}

setup_palettes();
load_settings();
inputs.forEach(input => input.addEventListener('input', queue));
document.getElementById('palette_name').addEventListener('change', queue);
document.getElementById('palette_button').addEventListener('click', toggle_palette_options);
document.addEventListener('click', close_palette_options);
document.getElementById('clear_storage').addEventListener('click', clear_storage);
sync();

</script>


</body>
</html>
